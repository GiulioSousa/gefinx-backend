server:
  port: 8080

spring:
  application:
    name: backend
  profiles:
    # Sem perfil explícito, carrega application-local.yml (ignorado pelo Git).
    # Em produção, defina SPRING_PROFILES_ACTIVE e as variáveis de ambiente abaixo.
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/financas_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

financas:
  jwt:
    secret: ${JWT_SECRET}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:1440}
