server:
  port: 8080

spring:
  application:
    name: gefinx-backend
  profiles:
    # Sem perfil explícito, carrega application-local.yml (ignorado pelo Git).
    # Em produção, defina SPRING_PROFILES_ACTIVE e as variáveis de ambiente abaixo.
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/financas_db}
    # Usuário de execução: só DML nas três tabelas. Quem cria e altera o schema é o
    # usuário de migration abaixo — ver backend/db/criar-roles.sql.
    username: ${DB_USERNAME:financas_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Credencial própria, com DDL, usada só durante a subida. O Spring Boot deriva a
    # conexão do datasource acima, trocando apenas usuário e senha.
    user: ${DB_MIGRACAO_USERNAME:financas_migracao}
    password: ${DB_MIGRACAO_PASSWORD}

logging:
  file:
    # Em console, o log e a trilha somem junto com a janela — e "quem entrou na semana
    # passada" é exatamente a pergunta que a trilha existe para responder. Rotação e
    # retenção ficam nos padrões do Spring Boot: 10MB por arquivo, 7 arquivos de histórico.
    name: logs/backend.log
  level:
    com.gefinx.backend: INFO
    # Nível próprio, de propósito: calar a depuração da aplicação não pode, junto,
    # apagar o registro de quem entrou.
    AUDITORIA: INFO

financas:
  jwt:
    secret: ${JWT_SECRET}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:1440}
  limite-requisicoes:
    # Protege as rotas de autenticação contra força bruta, por endereço de origem.
    login:
      tentativas: 5
      janela: 1m
    # Por conta alvo: o limite por IP acima não alcança ataque distribuído,
    # em que cada origem chega com o balde intacto. Zera a cada login bem-sucedido.
    login-por-conta:
      tentativas: 10
      janela: 15m
    registro:
      tentativas: 3
      janela: 10m
