# A cada push na main, o release-please lê os Conventional Commits desde a
# última versão e abre (ou atualiza) um PR de release com a próxima versão e o
# CHANGELOG. O merge desse PR cria a tag vX.Y.Z e a Release no GitHub.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
